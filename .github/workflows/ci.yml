# CI for local-ai-demo. No secrets and no AI API credentials are used or needed: the only network
# access beyond GitHub is to Docker Hub, PyPI, npm and the Ollama model registry, to build and to
# download the model for the end-to-end offline test. Actions are pinned to commit SHAs (tag in the
# comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: notes
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (Python version from .python-version)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest
      - name: Integration tests (real PostgreSQL)
        env:
          DATABASE_URL: postgresql://notes:ci-only-password@localhost:5432/notes_test
        run: uv run pytest -m integration

  frontend:
    name: Frontend lint, typecheck, format and builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Build (full app, calls /api)
        run: npm run build
      - name: Build (public static site)
        run: npm run build:static

  config:
    name: Shell scripts and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo koalaman/shellcheck-alpine:v0.11.0 sh -c 'shellcheck -x -P SCRIPTDIR scripts/*.sh'
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - name: The runtime contract cannot build or reach the internet
        run: |
          # compose.yaml ships in the offline bundle: it must not build, and the private network
          # must stay internal.
          if docker compose -f compose.yaml config --format json | jq -e '.services[] | select(.build)' > /dev/null; then
            echo "compose.yaml must not contain build sections"; exit 1
          fi
          docker compose -f compose.yaml config --format json | jq -e '.networks.private.internal == true'
          docker compose -f compose.yaml config --format json \
            | jq -e '[.services[] | select(.ports)] | length == 1'

  images:
    name: Build images and check size and user
    runs-on: ubuntu-latest
    needs: [backend, frontend, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: cp .env.example .env && docker compose build web backend ollama
      - name: Sizes and users
        run: |
          for image in local-ai-demo-web:1.0.0 local-ai-demo-backend:1.0.0 local-ai-demo-ollama:0.40.3; do
            size=$(docker image inspect --format '{{.Size}}' "$image")
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            printf '%-32s %6d MB  user=%s\n' "$image" $((size / 1000000)) "$user"
            if [ -z "$user" ] || [ "$user" = "0" ] || [ "$user" = "root" ]; then
              echo "$image runs as root"; exit 1
            fi
          done

  offline:
    name: Offline bundle, end to end on a simulated air-gapped server
    runs-on: ubuntu-latest
    needs: [images]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cp .env.example .env
      - name: Build the bundle (tests ran above; downloads the model)
        run: ./scripts/build-bundle.sh --skip-tests
      - name: Verify checksums
        run: |
          ./scripts/verify-bundle.sh dist/local-ai-demo-bundle-*-linux-amd64.tar
          (cd dist/local-ai-demo-bundle-*-linux-amd64/ && ./scripts/verify-bundle.sh)
      - name: Reproducibility (repackage and compare)
        run: |
          first=$(cut -d' ' -f1 dist/local-ai-demo-bundle-*-linux-amd64.tar.sha256)
          ./scripts/build-bundle.sh --skip-tests > /dev/null
          second=$(cut -d' ' -f1 dist/local-ai-demo-bundle-*-linux-amd64.tar.sha256)
          echo "first  $first"; echo "second $second"
          [ "$first" = "$second" ]
      - name: Install and prove on a server with no internet (Docker-in-Docker, internal network)
        run: ./scripts/airgap-simulate.sh
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airgap-report
          path: |
            dist/airgap-report-simulated.log
            dist/local-ai-demo-bundle-*-linux-amd64/manifest.json
            dist/local-ai-demo-bundle-*-linux-amd64.tar.sha256
          if-no-files-found: warn
