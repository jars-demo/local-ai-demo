# Serves the static site and proxies the API, so the browser talks to one origin and the backend
# needs no CORS and no published port.
#
#   /api/  ->  http://backend:8000   ("backend" is the Compose service name, resolved by Docker DNS)
#
# Docker's embedded DNS server is 127.0.0.11. Resolving through it at request time (the variable in
# proxy_pass) means nginx starts even before the backend exists and follows it if it restarts with
# a new IP address.

# AI endpoints are slow on a CPU: allow a modest burst per client, queue the rest briefly, then
# answer 429 instead of piling up work.
limit_req_zone $binary_remote_addr zone=inference:1m rate=12r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Everything comes from this origin. Next.js static export inlines small scripts and styles,
    # hence 'unsafe-inline'. connect-src 'self' means the page cannot call any other host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The container's own liveness: nginx is serving. Not proxied anywhere.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/(ask|notes/[0-9]+/summary)$ {
        limit_req zone=inference burst=6 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        # CPU inference: the first answer also loads the model. Match LLM_TIMEOUT_SECONDS.
        proxy_read_timeout 200s;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
